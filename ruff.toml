# Same rule set as the VIPER packages (toolviper, xradio, graphviper,
# astroviper):
#   E4/E7/E9 -- pycodestyle errors (import placement, statement syntax, runtime)
#   F        -- pyflakes: undefined names, unused imports, unused variables
#   B        -- flake8-bugbear: likely bugs (mutable defaults, loop captures, ...)
#   UP       -- pyupgrade: outdated syntax/typing
#   I        -- isort-compatible import sorting
target-version = "py311"
# testviper clones the component repositories into external/ (make build-main);
# they are linted in their own repositories.
extend-exclude = ["external"]

[lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
