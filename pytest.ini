[pytest]
;; ReportPortal config
rp_endpoint = https://report-portal.nrao.casa
rp_project = testviper
rp_launch = 'Testviper'
rp_launch_attributes = 'pytest'
rp_ignore_attributes = 'xfail' 'usefixture'
rp_verify_ssl = False ## only because the pilot is using a self-signed SSL certificate
rp_launch_uuid_print = True
rp_api_retries = 2
; rp_mode = DEFAULT
