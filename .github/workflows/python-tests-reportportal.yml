---
name: Integration Tests with ReportPortal

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - '**.rst'
  pull_request:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - '**.rst'
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Source repository that triggered the dispatch'
        required: false
        type: string
      source_ref:
        description: 'Source branch/ref that triggered the dispatch'
        required: false
        type: string
      source_sha:
        description: 'Source commit SHA that triggered the dispatch'
        required: false
        type: string
      source_actor:
        description: 'Source actor that triggered the dispatch'
        required: false
        type: string
      source_workflow:
        description: 'Source workflow that triggered the dispatch'
        required: false
        type: string
      source_run_id:
        description: 'Source run ID that triggered the dispatch'
        required: false
        type: string
      source_run_number:
        description: 'Source run number that triggered the dispatch'
        required: false
        type: string
      triggered_by:
        description: 'How this workflow was triggered'
        required: false
        type: string

jobs:
  integration-tests-reportportal:
    runs-on: ubuntu-latest
    env:
      RP_API_KEY: ${{ secrets.REPORTPORTAL_API_KEY }}
      AGENT_NO_ANALYTICS: True
      TV_SOURCE_REPO: ${{ github.event.inputs.source_repository }}
      TV_SOURCE_REF: ${{ github.event.inputs.source_ref }}
      TV_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
      TV_SOURCE_ACTOR: ${{ github.event.inputs.source_actor }}
      TV_SOURCE_WORKFLOW: ${{ github.event.inputs.source_workflow }}
      TV_SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
      TV_SOURCE_RUN_NUMBER: ${{ github.event.inputs.source_run_number }}
      TV_TRIGGERED_BY: ${{ github.event.inputs.triggered_by }}

    steps:
    - name: Log dispatch information
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "Workflow triggered by repository dispatch"
        echo "Source repository: ${{ github.event.inputs.source_repository }}"
        echo "Source ref: ${{ github.event.inputs.source_ref }}"
        echo "Source SHA: ${{ github.event.inputs.source_sha }}"
        echo "Source actor: ${{ github.event.inputs.source_actor }}"
        echo "Source workflow: ${{ github.event.inputs.source_workflow }}"
        echo "Source run ID: ${{ github.event.inputs.source_run_id }}"
        echo "Source run number: ${{ github.event.inputs.source_run_number }}"
        echo "Triggered by: ${{ github.event.inputs.triggered_by }}"

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install GCC 14
      run: |
        sudo apt-get update
        sudo apt-get install -y "gcc-14" "g++-14"
        # Make the requested compiler the one CMake/scikit-build-core picks up
        # for the pip build below (env persists to later steps via GITHUB_ENV).
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"
        "g++-14" --version

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install testviper dependencies
      run: |
        pwd
        make build-testviper

    - name: Clone and install component repositories
      run: |
        make build-main
        ls -l external/

    - parallel:
      - name: Run tests for TestViper
        continue-on-error: true
        run: |
          ./scripts/run-tests.sh "TestViper Integration" "." "tests/integration"

      - name: Run tests for ToolViper
        continue-on-error: true
        run: |
          ./scripts/run-tests.sh "ToolViper" "external/toolviper" "tests"

      - name: Run tests for Xradio
        continue-on-error: true
        run: |
          ./scripts/run-tests.sh "Xradio" "external/xradio" "tests"

      - name: Run tests for GraphViper
        continue-on-error: true
        run: |
          ./scripts/run-tests.sh "GraphViper" "external/graphviper" "tests"

      - name: Run tests for AstroViper
        continue-on-error: true
        run: |
          ./scripts/run-tests.sh "AstroViper" "external/astroviper" "tests"

    - name: Generate and display links to ReportPortal for this run
      run: |
        echo "## View Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "View the results of these tests in ReportPortal:" >> $GITHUB_STEP_SUMMARY
        echo "- [This Run](https://report-portal.nrao.casa/ui/#testviper/launches/all?launchesParams=filter.has.compositeAttribute%3Drun_id%3A${GITHUB_RUN_ID})" >> $GITHUB_STEP_SUMMARY
        echo "- [All tests for this ref](https://report-portal.nrao.casa/ui/#testviper/launches/all?launchesParams=filter.has.compositeAttribute%3Dtestviper_ref%3A${GITHUB_REF_NAME})" >> $GITHUB_STEP_SUMMARY
