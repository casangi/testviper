---
name: Integration Tests on Branch - Linux

# Push to a branch: Python 3.13 only.
# Pull request / push to main: Python 3.12, 3.13 and 3.14.
on:
  push:
    paths-ignore:
      - '**.md'
      - '**.rst'
  pull_request:

concurrency:
  # A newer push to the same branch/PR cancels the older run. Each run on main
  # gets its own group, so merges are never queued behind or cancelled by
  # each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: >-
      Integration Tests on ${{ matrix.os }} /
      Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ${{ fromJson((github.event_name == 'push' && github.ref != 'refs/heads/main') && '["3.13"]' || '["3.12", "3.13", "3.14"]') }}
    env:
      # TODO: remove once the toolviper, xradio, graphviper and astroviper
      # main branches (installed by `make build-main`) declare
      # requires-python "<3.15"; until then pip refuses them on 3.14.
      PIP_IGNORE_REQUIRES_PYTHON: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y "gcc-14" "g++-14"
          # Make the requested compiler the one CMake/scikit-build-core picks up
          # for the pip build below (env persists to later steps via GITHUB_ENV).
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          "g++-14" --version

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install testviper dependencies and components
        run: |
          make build-main  #installs under external
          ls -l external
      - name: Create test results directories
        run: |
          mkdir -p testviper-tests/${{ matrix.python-version }}
          mkdir -p toolviper-tests/${{ matrix.python-version }}
          mkdir -p graphviper-tests/${{ matrix.python-version }}
          mkdir -p astroviper-tests/${{ matrix.python-version }}
      - name: Run testviper integration tests
        run: |
          pytest -v tests/integration/ \
          --junitxml="testviper-tests/${{ matrix.python-version }}/testviper-test-results-${{ matrix.python-version }}.xml"
          ls -l testviper-tests/${{ matrix.python-version }}/

      - name: Create xradio test results directory
        run: mkdir -p xradio-tests/${{ matrix.python-version }}

      - name: Run xradio tests
        run: |
          pytest -v ./external/xradio/tests \
          --cov=xradio \
          --no-cov-on-fail \
          --doctest-modules \
          --cov-report=xml:xradio-tests/${{ matrix.python-version }}/coverage.xml \
          --junitxml="xradio-tests/${{ matrix.python-version }}/xradio-test-results-${{ matrix.python-version }}.xml"
          ls -l .
          ls -l xradio-tests/${{ matrix.python-version }}
      - name: Run toolviper tests
        run: |
          pytest -v ./external/toolviper/tests/ \
          --cov=toolviper \
          --no-cov-on-fail \
          --doctest-modules \
          --cov-report=xml:toolviper-tests/${{ matrix.python-version }}/coverage.xml \
          --junitxml="toolviper-tests/${{ matrix.python-version }}/toolviper-test-results-${{ matrix.python-version }}.xml"
          ls -l toolviper-tests/${{ matrix.python-version }}
      - name: Run graphviper tests
        run: |
          pytest -v ./external/graphviper/tests/ \
          --cov=graphviper \
          --no-cov-on-fail \
          --doctest-modules \
          --cov-report=xml:graphviper-tests/${{ matrix.python-version }}/coverage.xml \
          --junitxml="graphviper-tests/${{ matrix.python-version }}/graphviper-test-results-${{ matrix.python-version }}.xml"
          ls -l graphviper-tests/${{ matrix.python-version }}

      - name: Run astroviper tests
        run: |
          pytest -v ./external/astroviper/tests/ \
          --cov=astroviper \
          --no-cov-on-fail \
          --doctest-modules \
          --cov-report=xml:astroviper-tests/${{ matrix.python-version }}/coverage.xml \
          --junitxml="astroviper-tests/${{ matrix.python-version }}/astroviper-test-results-${{ matrix.python-version }}.xml"
          ls -l astroviper-tests/${{ matrix.python-version }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          # The junit and coverage files are written to <component>-tests/<python-version>/.
          path: |
            *-tests/${{ matrix.python-version }}/*.xml
          if-no-files-found: ignore
