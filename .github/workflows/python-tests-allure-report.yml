---
name: Integration Tests with Allure Report

on:
  push:
    branches: ["60-create-a-dispatch-to-benchviper"]
    paths-ignore:
      - '**.md'
      - '**.rst'
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Source repository that triggered the dispatch'
        required: false
        type: string
      source_ref:
        description: 'Source branch/ref that triggered the dispatch'
        required: false
        type: string
      source_sha:
        description: 'Source commit SHA that triggered the dispatch'
        required: false
        type: string
      source_actor:
        description: 'Source actor that triggered the dispatch'
        required: false
        type: string
      source_workflow:
        description: 'Source workflow that triggered the dispatch'
        required: false
        type: string
      source_run_id:
        description: 'Source run ID that triggered the dispatch'
        required: false
        type: string
      source_run_number:
        description: 'Source run number that triggered the dispatch'
        required: false
        type: string
      triggered_by:
        description: 'How this workflow was triggered'
        required: false
        type: string

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Log dispatch information
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "Workflow triggered by repository dispatch"
        echo "Source repository: ${{ github.event.inputs.source_repository }}"
        echo "Source ref: ${{ github.event.inputs.source_ref }}"
        echo "Source SHA: ${{ github.event.inputs.source_sha }}"
        echo "Source actor: ${{ github.event.inputs.source_actor }}"
        echo "Source workflow: ${{ github.event.inputs.source_workflow }}"
        echo "Source run ID: ${{ github.event.inputs.source_run_id }}"
        echo "Source run number: ${{ github.event.inputs.source_run_number }}"
        echo "Triggered by: ${{ github.event.inputs.triggered_by }}"
    
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install GCC 14
      run: |
        sudo apt-get update
        sudo apt-get install -y "gcc-14" "g++-14"
        # Make the requested compiler the one CMake/scikit-build-core picks up
        # for the pip build below (env persists to later steps via GITHUB_ENV).
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"
        "g++-14" --version
        
    - name: Install Allure CLI
      run: |
        wget -qO- https://nodejs.org/dist/v24.12.0/node-v24.12.0-linux-x64.tar.xz | tar -xJ
        export PATH=$HOME/node-v24.12.0-linux-x64/bin:$PATH
        npm install -g allure@3.1.0
        which allure
        allure --version
        # Leaving Allure 2 installation commented out for reference
        #wget -qO- https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz | tar -xz
        #sudo mv allure-2.24.1 /opt/allure
        #sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
        
    - name: Repository Dispatch to benchviper
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.TESTVIPER_DISPATCH_TOKEN }}
        script: |
          const payload = {
            event_type: 'benchmark-test-trigger',
            client_payload: {
              repository: '${{ github.repository }}',
              ref: '${{ github.ref }}',
              sha: '${{ github.sha }}',
              actor: '${{ github.actor }}',
              workflow: '${{ github.workflow }}',
              run_id: '${{ github.run_id }}',
              run_number: '${{ github.run_number }}',
              component: '${{ github.event.repository.name }}'
            }
          };
          
          // Send repository dispatch to target repository
          await github.rest.repos.createDispatchEvent({
            owner: 'casangi',
            repo: 'testviper',
            event_type: payload.event_type,
            client_payload: payload.client_payload
          });
          
          // Note: repository_dispatch is repository-wide and not branch-specific.

          console.log('Repository dispatch sent successfully to testviper');
